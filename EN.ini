ID33=Rectangle — highlights an area of the interface with a border and assigns an index number.
ID34=Line — underlines text or elements (with auto-alignment).
ID35=Arrow — points to a specific direction or element without obscuring the text.
ID36=Blur — permanently masks passwords, tokens, and personal data.
ID37=Select All — quickly selects the entire current layer (within the list of shapes).
ID38=Edit — click on a numbered circle (1, 2, ...) to change the text.
ID39=Empty Marker — press Enter without entering text to leave only the visual marker.
ID40=Undo / Redo — step-by-step reversal or re-application of actions (within the current layer).
ID41=Save (OK) — saves both the clean and annotated versions of the file, and copies the annotated image to the clipboard.
ID42=Tray — change language (RU/EN/ZH), file format (JPG/PNG), target folder, or open .ai projects.
ID43=Authors: EvGen & Gemini AI Assistant (Google). 2026. v.1.2.4<br><a href="https://github.com/EuSPb24/AIScreenshoter" style="color: #89B4FA;">GitHub://github.com</a>
ID44=Close Help
ID45=Previous Layer
ID46=Next Layer
ID47=Layer {cur} of {total}
ID48=Delete Current Layer
ID49=ESC Key — cancels the operation without saving (the original, unannotated screenshot remains in the clipboard). If markers are present, press ESC twice.
ID50=Layers — capturing the screen again (Win+Shift+S) adds a new layer. Optimal for AI: 3–5 layers (max. 6).
ID51=Press ESC again to exit without saving
ID52=6 layers created: with a larger number, AI chats may compress the text.
