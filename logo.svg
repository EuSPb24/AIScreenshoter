<svg xmlns="http://w3.org" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Свечение центрального импульса -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="22%" stop-color="#FEF08A" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Градиент нити Человека -->
    <linearGradient id="humanStrand" gradientUnits="userSpaceOnUse" x1="80" y1="36" x2="160" y2="204">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <!-- Градиент нити ИИ -->
    <linearGradient id="aiStrand" gradientUnits="userSpaceOnUse" x1="160" y1="36" x2="80" y2="204">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Градиент перемычек (мостов симбиоза) -->
    <linearGradient id="rungGrad" gradientUnits="userSpaceOnUse" x1="85" y1="120" x2="155" y2="120">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Фон иконки -->
  <rect width="240" height="240" rx="48" fill="#090D16"/>

  <!-- ПЕРЕМЫЧКИ СПИРАЛИ (Точки контакта между нитями) -->
  <g stroke="url(#rungGrad)" stroke-width="2.2" stroke-linecap="round" opacity="0.65">
    <!-- Верхний виток -->
    <line x1="94" y1="54" x2="146" y2="54"/>
    <line x1="88" y1="76" x2="152" y2="76"/>
    <line x1="98" y1="98" x2="142" y2="98"/>
    <!-- Нижний виток -->
    <line x1="98" y1="142" x2="142" y2="142"/>
    <line x1="88" y1="164" x2="152" y2="164"/>
    <line x1="94" y1="186" x2="146" y2="186"/>
  </g>

  <!-- УЗЛЫ НА ПЕРЕМЫЧКАХ -->
  <g>
    <!-- Красные узлы (левая сторона верхнего витка, правая нижнего) -->
    <circle cx="94" cy="54" r="3" fill="#FB7185"/>
    <circle cx="88" cy="76" r="3.5" fill="#F43F5E"/>
    <circle cx="98" cy="98" r="3" fill="#FB7185"/>
    <circle cx="142" cy="142" r="3" fill="#FB7185"/>
    <circle cx="152" cy="164" r="3.5" fill="#F43F5E"/>
    <circle cx="146" cy="186" r="3" fill="#FB7185"/>

    <!-- Синие узлы (правая сторона верхнего витка, левая нижнего) -->
    <circle cx="146" cy="54" r="3" fill="#7DD3FC"/>
    <circle cx="152" cy="76" r="3.5" fill="#38BDF8"/>
    <circle cx="142" cy="98" r="3" fill="#7DD3FC"/>
    <circle cx="98" cy="142" r="3" fill="#7DD3FC"/>
    <circle cx="88" cy="164" r="3.5" fill="#38BDF8"/>
    <circle cx="94" cy="186" r="3" fill="#7DD3FC"/>
  </g>

  <!-- ДВОЙНАЯ СПИРАЛЬ ДНК -->
  <!-- Нить ИИ (Синяя: сверху справа -> через центр -> вниз влево) -->
  <path d="M 142 36 C 164 68, 152 96, 120 120 C 88 144, 76 172, 98 204" 
        fill="none" stroke="url(#aiStrand)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- Нить Человека (Красная: сверху слева -> через центр -> вниз вправо) -->
  <path d="M 98 36 C 76 68, 88 96, 120 120 C 152 144, 164 172, 142 204" 
        fill="none" stroke="url(#humanStrand)" stroke-width="6.5" stroke-linecap="round"/>

  <!-- ЦЕНТР: Квантовый импульс в точке переплетения -->
  <g transform="translate(120, 120)">
    <circle cx="0" cy="0" r="36" fill="url(#coreGlow)"/>
    <circle cx="0" cy="0" r="17" fill="none" stroke="#FDE047" stroke-width="0.9" stroke-dasharray="6 4 2 4" opacity="0.75"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#FFFFFF" stroke-width="0.7" opacity="0.6"/>
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="#F59E0B" opacity="0.85" transform="rotate(28)"/>
    <g transform="rotate(-12)">
      <polygon points="0,-32 2.2,-3 28,0 2.2,3 0,32 -2.2,3 -28,0 -2.2,-3" fill="#FEF08A"/>
      <polygon points="0,-20 1.4,-1.4 18,0 1.4,1.4 0,20 -1.4,1.4 -18,0 -1.4,-1.4" fill="#FFFFFF"/>
    </g>
    <circle cx="0" cy="0" r="4.2" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="1.8" fill="#F59E0B"/>
  </g>
</svg>
