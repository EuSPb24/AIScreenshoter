ID33=Прямоугольник — выделение области интерфейса рамкой с присвоением номера акцента.
ID34=Линия — прямое подчеркивание текста или элементов (с автовыравниванием).
ID35=Стрелка — указание направления или конкретного элемента без перекрытия текста.
ID36=Размытие (Блюр) — необратимое скрытие паролей, токенов и личных данных.
ID37=Выделить всё — быстрое выделение всего текущего слоя целиком (в списке фигур).
ID38=Редактирование — кликните по кружку с номером (1, 2...), чтобы изменить текст.
ID39=Пустой акцент — нажмите Enter без текста, чтобы оставить только визуальную метку.
ID40=Отмена / Повтор — пошаговый откат или возврат действий (работает внутри текущего слоя).
ID41=Сохранить (OK) — сохраняет чистый и размеченный файлы, а в буфер кладет картинку с текстом.
ID42=Трей — смена языка (RU/EN/ZH), формата (JPG/PNG), папки и открытие проектов .ai.
ID43=Авторы: EvGen и ИИ-ассистент Gemini (Google). 2026. v.1.2.4<br><a href="https://github.com/EuSPb24/AIScreenshoter" style="color: #89B4FA;">GitHub://github.com</a>
ID44=Закрыть справку
ID45=Предыдущий слой
ID46=Следующий слой
ID47=Слой {cur} из {total}
ID48=Удалить текущий слой
ID49=Клавиша ESC — отменяет работу без сохранения (в буфере остается чистый снимок ОС). Если есть метки, требуется двойное нажатие ESC.
ID50=Слои — повторный захват экрана (Win+Shift+S) добавляет новый слой. Оптимально для ИИ: 3–5 слоев (макс. 6).
ID51=Нажмите ESC еще раз, чтобы выйти без сохранения
ID52=Создано 6 слоев: при большем количестве чаты ИИ могут сжимать текст.
