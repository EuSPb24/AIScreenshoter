ID45=上一图层
ID46=下一图层
ID47=第 {cur} 层，共 {total} 层
ID48=删除当前图层
ID49=ESC 键 — 取消操作而不保存（剪贴板中保留原始系统截图）。如果画面上有标记，请按两次 ESC 键。
ID50=图层 — 重新截图（Win+Shift+S）可添加新图层。AI 最佳图层数：3–5 层（最多 6 层）。
ID51=再次按 ESC 键退出而不保存
ID52=已创建 6 个图层：超过此数量可能会导致 AI 聊天压缩文字。

