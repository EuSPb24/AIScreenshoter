ID33=矩形 — 用边框框选界面区域并分配编号。
ID34=直线 — 直接为文本或元素添加下划线（支持自动对齐）。
ID35=箭头 — 指示方向或特定元素，且不遮挡文字。
ID36=模糊遮挡 — 永久隐藏密码、密钥和个人隐私数据。
ID37=全选图像 — 快速选中整个当前图层（在形状列表中）。
ID38=编辑 — 点击带数字（1、2…）的圆圈以修改文本。
ID39=空标记 — 不输入文本直接按 Enter 键，仅保留视觉标记。
ID40=撤销 / 重做 — 逐步撤销或重做操作（在当前图层内有效）。
ID41=保存（确定） — 保存原图和标注图，并将带文字的完整图像复制到剪贴板。
ID42=托盘 — 切换语言（俄语/英语/中文）、格式（JPG/PNG）、保存目录或打开 .ai 项目。
ID43=作者：EvGen 与 Gemini AI 助手 (Google)。2026 年。版本 1.2.4<br><a href="https://github.com/EuSPb24/AIScreenshoter" style="color: #89B4FA;">GitHub://github.com</a>
